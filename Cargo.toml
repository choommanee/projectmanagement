[workspace]
resolver = "2"
members = [
    "engines/_template",
    "engines/mrp-engine",
    "engines/traceability-engine",
    "libs/rust/obs",
    "libs/rust/db",    # added in Task 12
]

[workspace.package]
edition = "2021"
rust-version = "1.83"

[workspace.dependencies]
tokio = { version = "1", features = ["macros", "net", "io-util", "sync", "rt-multi-thread"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "uuid", "chrono"] }
anyhow = "1"
thiserror = "1"
