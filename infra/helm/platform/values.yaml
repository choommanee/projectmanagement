global:
  imageRegistry: ghcr.io/pmplatform
  # Default image tag — pinned to chart appVersion; override per-service block below
  # or via `--set global.imageTag=<sha>` for digest-pinned production deploys.
  imageTag: 0.1.0
  tenancyTier: shared

postgres:
  external: false
  dsn: ""

redis:
  external: false
  url: ""

nats:
  external: false
  url: ""

# Top-level observability configuration. Each service reads OTEL_EXPORTER_OTLP_ENDPOINT
# from this block (overridable per-service).
observability:
  otlpEndpoint: http://otel-collector:4318

# Toggle blocks (legacy). Per-service config blocks below are the source of truth
# for image/resources/env.
services:
  identity:    { enabled: true, replicas: 2 }
  tenant:      { enabled: true, replicas: 2 }
  project:     { enabled: true, replicas: 2 }
  workspace:   { enabled: true, replicas: 2 }
  workflow:    { enabled: true, replicas: 2 }
  audit:       { enabled: true, replicas: 1 }

# ---------------------------------------------------------------------------
# identity-svc
# ---------------------------------------------------------------------------
identity:
  enabled: true
  replicas: 2
  image:
    repository: ghcr.io/pmplatform/identity-svc
    tag: 0.1.0
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8082
    targetPort: 8082
  env:
    DATABASE_URL: ""
    NATS_URL: "nats://nats:4222"
    JWT_ISSUER: "pm-platform"
    JWT_AUDIENCE: "pm-platform-clients"
    JWT_SECRET: ""
    JWT_TTL: "3600"
    OTEL_EXPORTER_OTLP_ENDPOINT: ""
    OTEL_SERVICE_NAME: "identity-svc"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

# ---------------------------------------------------------------------------
# tenant-svc
# ---------------------------------------------------------------------------
tenant:
  enabled: true
  replicas: 2
  image:
    repository: ghcr.io/pmplatform/tenant-svc
