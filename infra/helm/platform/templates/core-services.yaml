{{- if .Values.project.enabled -}}
{{- $svc := "project-svc" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "platform.fullname" (dict "ctx" . "svc" $svc) }}
  labels:
    {{- include "platform.serviceLabels" (dict "ctx" . "svc" $svc) | nindent 4 }}
spec:
  replicas: {{ .Values.project.replicas }}
  selector:
    matchLabels:
      {{- include "platform.selectorLabels" (dict "ctx" . "svc" $svc) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "platform.selectorLabels" (dict "ctx" . "svc" $svc) | nindent 8 }}
    spec:
      containers:
        - name: {{ $svc }}
          image: "{{ .Values.project.image.repository }}:{{ .Values.project.image.tag }}"
          imagePullPolicy: {{ .Values.project.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: {{ .Values.project.service.targetPort }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.project.service.targetPort | quote }}
            - name: DATABASE_URL
              value: {{ .Values.project.env.DATABASE_URL | default .Values.postgres.dsn | quote }}
            - name: NATS_URL
              value: {{ .Values.project.env.NATS_URL | default .Values.nats.url | quote }}
            - name: IDENTITY_JWKS_URL
              value: {{ .Values.project.env.IDENTITY_JWKS_URL | quote }}
            - name: JWT_ISSUER
              value: {{ .Values.project.env.JWT_ISSUER | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.project.env.OTEL_EXPORTER_OTLP_ENDPOINT | default .Values.observability.otlpEndpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.project.env.OTEL_SERVICE_NAME | quote }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 6
          resources:
            {{- toYaml .Values.project.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "platform.fullname" (dict "ctx" . "svc" $svc) }}
  labels:
    {{- include "platform.serviceLabels" (dict "ctx" . "svc" $svc) | nindent 4 }}
spec:
  type: {{ .Values.project.service.type | default "ClusterIP" }}
  selector:
    {{- include "platform.selectorLabels" (dict "ctx" . "svc" $svc) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.project.service.port }}
      targetPort: {{ .Values.project.service.targetPort }}
      protocol: TCP
{{- end }}

