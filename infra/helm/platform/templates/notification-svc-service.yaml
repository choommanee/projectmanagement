{{- if .Values.notification.enabled -}}
{{- $svc := "notification-svc" -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "platform.fullname" (dict "ctx" . "svc" $svc) }}
  labels:
    {{- include "platform.serviceLabels" (dict "ctx" . "svc" $svc) | nindent 4 }}
spec:
  type: {{ .Values.notification.service.type | default "ClusterIP" }}
  ports:
    - name: http
      port: {{ .Values.notification.service.port }}
      targetPort: {{ .Values.notification.service.targetPort }}
      protocol: TCP
  selector:
    {{- include "platform.selectorLabels" (dict "ctx" . "svc" $svc) | nindent 4 }}
{{- end }}
