name: ci-go

on:
  push: { branches: [main] }
  pull_request:
    paths:
      - "services/**"
      - "libs/go/**"
      - "go.work"
      - ".github/workflows/ci-go.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: platform
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 3s
          --health-retries 20
      nats:
        image: nats:2.10-alpine
        ports: ["4222:4222"]
        options: >-
          --health-cmd "wget -qO- http://localhost:8222/healthz || exit 1"
          --health-interval 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://app:app@localhost:5432/platform?sslmode=disable
      NATS_URL: nats://localhost:4222
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.23" }
      - run: go work sync
      - run: |
          for d in $(find services libs/go -name go.mod -exec dirname {} \;); do
            echo "==> $d"
            (cd "$d" && go vet ./... && go test ./... -count=1)
          done
